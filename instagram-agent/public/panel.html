<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel — Instagram DM Agent</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b0b0f;color:#e8e8e8;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-bottom:1px solid #2a2a4a}
header h1{font-size:1.1rem;font-weight:700}
header h1 span{background:linear-gradient(90deg,#e1306c,#833ab4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header a{color:#555;font-size:.8rem;text-decoration:none}
header a:hover{color:#aaa}
#status-badge{display:flex;align-items:center;gap:8px;font-size:.8rem;color:#888;padding:5px 14px;border:1px solid #2a2a4a;border-radius:20px;background:#111}
#status-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;transition:background .3s}
#status-dot.running{background:#e1306c;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
main{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:20px;max-width:1100px;margin:0 auto}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;padding:16px 20px}
.card-label{font-size:.7rem;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.card-value{font-size:1.9rem;font-weight:700;color:#fff}
.card-value.pink{color:#e1306c}
.card-sub{font-size:.72rem;color:#444;margin-top:4px}
.panel{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;padding:20px}
.panel h2{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:#555;margin-bottom:16px;border-bottom:1px solid #2a2a4a;padding-bottom:10px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.78rem;color:#aaa;margin-bottom:5px}
.field input[type=number]{width:100%;padding:9px 12px;background:#0f0f1a;border:1px solid #2a2a4a;border-radius:8px;color:#fff;font-size:.9rem;outline:none;transition:border .2s}
.field input[type=number]:focus{border-color:#833ab4}
.time-row{display:grid;grid-template-columns:1fr 14px 1fr;gap:4px;align-items:center}
.time-row span{text-align:center;color:#444;font-size:1.2rem;padding-top:5px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.toggle-label{font-size:.83rem;color:#aaa}
.toggle{position:relative;width:42px;height:22px}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;cursor:pointer;background:#2a2a4a;border-radius:22px;transition:.3s}
.slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.slider{background:linear-gradient(135deg,#e1306c,#833ab4)}
.toggle input:checked+.slider:before{transform:translateX(20px)}
.btn{width:100%;padding:10px;border:none;border-radius:8px;cursor:pointer;font-size:.88rem;font-weight:600;transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#e1306c,#833ab4);color:#fff;margin-bottom:9px}
.btn-secondary{background:#1e1e3a;color:#aaa;border:1px solid #2a2a4a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.leads-panel{overflow:hidden;display:flex;flex-direction:column}
.table-wrap{overflow-y:auto;max-height:300px}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{position:sticky;top:0;background:#1a1a2e;color:#555;text-transform:uppercase;font-size:.68rem;letter-spacing:.8px;padding:7px 10px;text-align:left;border-bottom:1px solid #2a2a4a;z-index:1}
td{padding:8px 10px;border-bottom:1px solid #1a1a2e;color:#ccc;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover td{background:#1e1e32}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:600}
.badge.sent{background:#1a3a2a;color:#4caf50}
.badge.skipped{background:#2a2a1a;color:#ff9800}
.badge.error{background:#3a1a1a;color:#f44336}
.empty-state{text-align:center;color:#333;padding:32px 0;font-size:.82rem}
.logs-panel{grid-column:1/-1}
.logs-panel h2{display:flex;align-items:center;justify-content:space-between}
.logs-panel h2 button{font-size:.68rem;background:transparent;border:1px solid #2a2a4a;color:#444;padding:3px 9px;border-radius:5px;cursor:pointer}
.logs-panel h2 button:hover{color:#aaa;border-color:#444}
#log-box{background:#0d1117;border:1px solid #1e2430;border-radius:8px;padding:12px;font-family:Consolas,'JetBrains Mono',monospace;font-size:.73rem;line-height:1.7;color:#8b949e;height:200px;overflow-y:auto}
.log-ts{color:#333}.log-ok{color:#3fb950}.log-warn{color:#d29922}.log-err{color:#f85149}.log-info{color:#8b949e}
#run-msg{margin-top:10px;font-size:.76rem;color:#555;text-align:center;min-height:16px}
</style>
</head>
<body>
<header>
  <h1>📲 <span>DM Agent</span> — Panel</h1>
  <div style="display:flex;align-items:center;gap:16px">
    <a href="/">← Web pública</a>
    <div id="status-badge">
      <div id="status-dot"></div>
      <span id="status-text">Idle</span>
    </div>
  </div>
</header>

<main>
  <div class="stats">
    <div class="card"><div class="card-label">Total DMs</div><div class="card-value" id="stat-total">—</div><div class="card-sub" id="stat-sent-sub"></div></div>
    <div class="card"><div class="card-label">Enviados hoy</div><div class="card-value pink" id="stat-today">—</div><div class="card-sub" id="stat-today-sub"></div></div>
    <div class="card"><div class="card-label">Última ejecución</div><div class="card-value" style="font-size:.95rem;padding-top:4px" id="stat-last">—</div><div class="card-sub" id="stat-next">—</div></div>
  </div>

  <div class="panel">
    <h2>Horario del agente</h2>
    <div class="field">
      <label>Hora de envío (UTC)</label>
      <div class="time-row">
        <input type="number" id="cfg-hour" min="0" max="23" placeholder="HH">
        <span>:</span>
        <input type="number" id="cfg-minute" min="0" max="59" placeholder="MM">
      </div>
    </div>
    <div class="field">
      <label>Límite diario de DMs</label>
      <input type="number" id="cfg-limit" min="1" max="50">
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Agente activo</span>
      <label class="toggle"><input type="checkbox" id="cfg-enabled" checked><span class="slider"></span></label>
    </div>
    <button class="btn btn-primary" id="btn-save" onclick="saveConfig()">Guardar cambios</button>
    <button class="btn btn-secondary" id="btn-run" onclick="runNow()">▶ Ejecutar ahora</button>
    <div id="run-msg"></div>
  </div>

  <div class="panel leads-panel">
    <h2>Leads contactados</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Usuario</th><th>Bio</th><th>Estado</th><th>Fecha</th></tr></thead>
        <tbody id="leads-body"><tr><td colspan="4" class="empty-state">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="panel logs-panel">
    <h2>Logs en tiempo real <button onclick="document.getElementById('log-box').innerHTML=''">Limpiar</button></h2>
    <div id="log-box"></div>
  </div>
</main>

<script>
function fmt(iso){if(!iso)return'—';const d=new Date(iso);return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}
function nextRun(h,m){const now=new Date(),next=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),h,m));if(next<=now)next.setUTCDate(next.getUTCDate()+1);const diff=next-now,hh=Math.floor(diff/3600000),mm=Math.floor((diff%3600000)/60000);return`Próxima en ${hh}h ${mm}m`}
function logClass(m){if(/error|fatal|failed/i.test(m))return'log-err';if(/warn|skip/i.test(m))return'log-warn';if(/sent|success|saved|login successful/i.test(m))return'log-ok';return'log-info'}

async function loadStats(){
  const s=await fetch('/api/stats').then(r=>r.json());
  document.getElementById('stat-total').textContent=s.total;
  document.getElementById('stat-sent-sub').textContent=s.sent+' confirmados';
  document.getElementById('stat-today').textContent=s.today;
  document.getElementById('stat-today-sub').textContent='de '+document.getElementById('cfg-limit').value+' límite';
  document.getElementById('stat-last').textContent=fmt(s.lastRun);
  const cfg=await fetch('/api/config').then(r=>r.json());
  document.getElementById('stat-next').textContent=cfg.enabled?nextRun(cfg.cronHour,cfg.cronMinute):'Agente desactivado';
}

async function loadConfig(){
  const cfg=await fetch('/api/config').then(r=>r.json());
  document.getElementById('cfg-hour').value=cfg.cronHour;
  document.getElementById('cfg-minute').value=String(cfg.cronMinute).padStart(2,'0');
  document.getElementById('cfg-limit').value=cfg.dailyLimit;
  document.getElementById('cfg-enabled').checked=cfg.enabled;
}

async function saveConfig(){
  const btn=document.getElementById('btn-save');
  btn.disabled=true;btn.textContent='Guardando...';
  await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    cronHour:parseInt(document.getElementById('cfg-hour').value),
    cronMinute:parseInt(document.getElementById('cfg-minute').value),
    dailyLimit:parseInt(document.getElementById('cfg-limit').value),
    enabled:document.getElementById('cfg-enabled').checked
  })});
  btn.textContent='✓ Guardado';setTimeout(()=>{btn.textContent='Guardar cambios';btn.disabled=false},2000);
  loadStats();
}

async function runNow(){
  const btn=document.getElementById('btn-run'),msg=document.getElementById('run-msg');
  btn.disabled=true;
  const res=await fetch('/api/run',{method:'POST'});
  if(res.status===409){msg.textContent='Ya está en ejecución.';msg.style.color='#ff9800';}
  else{msg.textContent='Iniciado. Revisa los logs.';msg.style.color='#4caf50';}
  btn.disabled=false;
}

async function loadLeads(){
  const leads=await fetch('/api/leads').then(r=>r.json());
  const tbody=document.getElementById('leads-body');
  if(!leads.length){tbody.innerHTML='<tr><td colspan="4" class="empty-state">Sin leads aún</td></tr>';return;}
  tbody.innerHTML=leads.map(l=>`<tr><td>@${l.username}</td><td title="${l.bio||''}">${(l.bio||'—').slice(0,35)}</td><td><span class="badge ${l.status}">${l.status}</span></td><td>${fmt(l.timestamp)}</td></tr>`).join('');
}

const logBox=document.getElementById('log-box');
let autoScroll=true;
logBox.addEventListener('scroll',()=>{autoScroll=logBox.scrollTop+logBox.clientHeight>=logBox.scrollHeight-20});
function appendLog(e){const d=document.createElement('div');d.innerHTML=`<span class="log-ts">${e.ts.slice(11,19)}</span>  <span class="${logClass(e.msg)}">${e.msg}</span>`;logBox.appendChild(d);if(autoScroll)logBox.scrollTop=logBox.scrollHeight}

new EventSource('/api/logs').onmessage=e=>appendLog(JSON.parse(e.data));

const dot=document.getElementById('status-dot'),stText=document.getElementById('status-text'),runBtn=document.getElementById('btn-run');
async function pollStatus(){
  const{running}=await fetch('/api/status').then(r=>r.json());
  dot.className=running?'running':'';
  stText.textContent=running?'Ejecutando...':'Idle';
  runBtn.textContent=running?'⏳ En ejecución':'▶ Ejecutar ahora';
}

loadConfig();loadStats();loadLeads();pollStatus();
setInterval(pollStatus,4000);setInterval(()=>{loadStats();loadLeads()},15000);
</script>
</body>
</html>
