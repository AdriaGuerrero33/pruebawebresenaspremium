<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram DM Agent</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b0b0f;color:#e8e8e8;min-height:100vh}

/* ─── Header ─────────────────────────── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;
  background:linear-gradient(135deg,#1a1a2e,#16213e);
  border-bottom:1px solid #2a2a4a;
}
header h1{font-size:1.2rem;font-weight:700;letter-spacing:.5px}
header h1 span{
  background:linear-gradient(90deg,#e1306c,#833ab4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent
}
#status-badge{
  display:flex;align-items:center;gap:8px;
  font-size:.8rem;color:#888;padding:6px 14px;
  border:1px solid #2a2a4a;border-radius:20px;background:#111
}
#status-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;transition:background .3s}
#status-dot.running{background:#e1306c;animation:pulse 1s infinite}
#status-dot.idle{background:#4caf50}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ─── Layout ─────────────────────────── */
main{display:grid;grid-template-columns:320px 1fr;grid-template-rows:auto 1fr;gap:20px;padding:24px;max-width:1200px;margin:0 auto}

/* ─── Stat cards ─────────────────────── */
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;padding:18px 22px}
.card-label{font-size:.72rem;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.card-value{font-size:2rem;font-weight:700;color:#fff}
.card-value.pink{color:#e1306c}
.card-sub{font-size:.75rem;color:#555;margin-top:4px}

/* ─── Panel ──────────────────────────── */
.panel{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;padding:22px}
.panel h2{font-size:.85rem;text-transform:uppercase;letter-spacing:1px;color:#666;margin-bottom:18px;border-bottom:1px solid #2a2a4a;padding-bottom:10px}

/* ─── Schedule form ──────────────────── */
.field{margin-bottom:16px}
.field label{display:block;font-size:.8rem;color:#aaa;margin-bottom:6px}
.field input[type=number]{
  width:100%;padding:10px 12px;background:#0f0f1a;border:1px solid #2a2a4a;
  border-radius:8px;color:#fff;font-size:.95rem;outline:none;transition:border .2s
}
.field input[type=number]:focus{border-color:#833ab4}
.time-row{display:grid;grid-template-columns:1fr 14px 1fr;gap:4px;align-items:center}
.time-row span{text-align:center;color:#555;font-size:1.2rem;padding-top:6px}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.toggle-label{font-size:.85rem;color:#aaa}
.toggle{position:relative;width:44px;height:24px}
.toggle input{opacity:0;width:0;height:0}
.slider{
  position:absolute;inset:0;cursor:pointer;
  background:#2a2a4a;border-radius:24px;transition:.3s
}
.slider:before{
  content:'';position:absolute;width:18px;height:18px;
  left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s
}
.toggle input:checked+.slider{background:linear-gradient(135deg,#e1306c,#833ab4)}
.toggle input:checked+.slider:before{transform:translateX(20px)}

.btn{
  width:100%;padding:11px;border:none;border-radius:8px;cursor:pointer;
  font-size:.9rem;font-weight:600;transition:opacity .2s,transform .1s
}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#e1306c,#833ab4);color:#fff;margin-bottom:10px}
.btn-secondary{background:#1e1e3a;color:#aaa;border:1px solid #2a2a4a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary.running-state{color:#e1306c;border-color:#e1306c}

/* ─── Leads table ────────────────────── */
.leads-panel{overflow:hidden;display:flex;flex-direction:column}
.leads-panel h2{flex-shrink:0}
.table-wrap{overflow-y:auto;max-height:340px;flex:1}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{position:sticky;top:0;background:#1a1a2e;color:#666;text-transform:uppercase;font-size:.7rem;letter-spacing:.8px;padding:8px 10px;text-align:left;border-bottom:1px solid #2a2a4a;z-index:1}
td{padding:9px 10px;border-bottom:1px solid #1e1e2e;color:#ccc;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover td{background:#1e1e32}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.badge.sent{background:#1a3a2a;color:#4caf50}
.badge.skipped{background:#2a2a1a;color:#ff9800}
.badge.error{background:#3a1a1a;color:#f44336}
.empty-state{text-align:center;color:#444;padding:40px 0;font-size:.85rem}

/* ─── Logs ───────────────────────────── */
.logs-panel{grid-column:1/-1}
.logs-panel h2{display:flex;align-items:center;justify-content:space-between}
.logs-panel h2 button{
  font-size:.7rem;background:transparent;border:1px solid #2a2a4a;
  color:#555;padding:3px 10px;border-radius:6px;cursor:pointer
}
.logs-panel h2 button:hover{color:#aaa;border-color:#555}
#log-box{
  background:#0d1117;border:1px solid #1e2430;border-radius:8px;
  padding:14px;font-family:'JetBrains Mono',Consolas,monospace;
  font-size:.75rem;line-height:1.7;color:#8b949e;
  height:220px;overflow-y:auto;
}
.log-ts{color:#444}
.log-info{color:#8b949e}
.log-ok{color:#3fb950}
.log-warn{color:#d29922}
.log-err{color:#f85149}
</style>
</head>
<body>

<header>
  <h1>📲 <span>Instagram DM Agent</span></h1>
  <div id="status-badge">
    <div id="status-dot" class="idle"></div>
    <span id="status-text">Idle</span>
  </div>
</header>

<main>
  <!-- Stats -->
  <div class="stats">
    <div class="card">
      <div class="card-label">Total DMs enviados</div>
      <div class="card-value" id="stat-total">—</div>
      <div class="card-sub" id="stat-sent-sub"></div>
    </div>
    <div class="card">
      <div class="card-label">Enviados hoy</div>
      <div class="card-value pink" id="stat-today">—</div>
      <div class="card-sub" id="stat-today-sub"></div>
    </div>
    <div class="card">
      <div class="card-label">Última ejecución</div>
      <div class="card-value" style="font-size:1rem;padding-top:6px" id="stat-last">—</div>
      <div class="card-sub" id="stat-next">Calculando próxima...</div>
    </div>
  </div>

  <!-- Left: Schedule -->
  <div class="panel">
    <h2>Horario del agente</h2>

    <div class="field">
      <label>Hora de envío (UTC)</label>
      <div class="time-row">
        <input type="number" id="cfg-hour" min="0" max="23" placeholder="HH">
        <span>:</span>
        <input type="number" id="cfg-minute" min="0" max="59" placeholder="MM">
      </div>
    </div>

    <div class="field">
      <label>Límite diario de DMs</label>
      <input type="number" id="cfg-limit" min="1" max="50" placeholder="20">
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Agente activo</span>
      <label class="toggle">
        <input type="checkbox" id="cfg-enabled" checked>
        <span class="slider"></span>
      </label>
    </div>

    <button class="btn btn-primary" id="btn-save" onclick="saveConfig()">Guardar cambios</button>
    <button class="btn btn-secondary" id="btn-run" onclick="runNow()">▶ Ejecutar ahora</button>

    <div id="run-msg" style="margin-top:12px;font-size:.78rem;color:#666;text-align:center;min-height:18px"></div>
  </div>

  <!-- Right: Leads -->
  <div class="panel leads-panel">
    <h2>Leads contactados</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Bio</th>
            <th>Estado</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody id="leads-body">
          <tr><td colspan="4" class="empty-state">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Logs -->
  <div class="panel logs-panel">
    <h2>
      Logs en tiempo real
      <button onclick="clearLogs()">Limpiar</button>
    </h2>
    <div id="log-box"></div>
  </div>
</main>

<script>
// ── Helpers ──────────────────────────────────────────────────
function fmt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' }) +
    ' ' + d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
}

function nextRun(h, m) {
  const now = new Date();
  const next = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), h, m));
  if (next <= now) next.setUTCDate(next.getUTCDate() + 1);
  const diff = next - now;
  const hh = Math.floor(diff / 3600000);
  const mm = Math.floor((diff % 3600000) / 60000);
  return `Próxima en ${hh}h ${mm}m`;
}

function logClass(msg) {
  if (/error|fatal|failed/i.test(msg)) return 'log-err';
  if (/warn|skip/i.test(msg)) return 'log-warn';
  if (/sent|success|saved|login successful/i.test(msg)) return 'log-ok';
  return 'log-info';
}

// ── Stats ─────────────────────────────────────────────────────
async function loadStats() {
  const s = await fetch('/api/stats').then(r => r.json());
  document.getElementById('stat-total').textContent = s.total;
  document.getElementById('stat-sent-sub').textContent = `${s.sent} confirmados`;
  document.getElementById('stat-today').textContent = s.today;
  document.getElementById('stat-today-sub').textContent = `de ${document.getElementById('cfg-limit').value || '20'} límite`;
  document.getElementById('stat-last').textContent = fmt(s.lastRun);
  const cfg = await fetch('/api/config').then(r => r.json());
  document.getElementById('stat-next').textContent = cfg.enabled ? nextRun(cfg.cronHour, cfg.cronMinute) : 'Agente desactivado';
}

// ── Config ────────────────────────────────────────────────────
async function loadConfig() {
  const cfg = await fetch('/api/config').then(r => r.json());
  document.getElementById('cfg-hour').value = cfg.cronHour;
  document.getElementById('cfg-minute').value = String(cfg.cronMinute).padStart(2,'0');
  document.getElementById('cfg-limit').value = cfg.dailyLimit;
  document.getElementById('cfg-enabled').checked = cfg.enabled;
}

async function saveConfig() {
  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  const body = {
    cronHour: parseInt(document.getElementById('cfg-hour').value),
    cronMinute: parseInt(document.getElementById('cfg-minute').value),
    dailyLimit: parseInt(document.getElementById('cfg-limit').value),
    enabled: document.getElementById('cfg-enabled').checked,
  };
  await fetch('/api/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  btn.textContent = '✓ Guardado';
  setTimeout(() => { btn.textContent = 'Guardar cambios'; btn.disabled = false; }, 2000);
  loadStats();
}

// ── Run Now ───────────────────────────────────────────────────
async function runNow() {
  const btn = document.getElementById('btn-run');
  const msg = document.getElementById('run-msg');
  btn.disabled = true;
  msg.textContent = '';
  const res = await fetch('/api/run', { method:'POST' });
  if (res.status === 409) {
    msg.textContent = 'El agente ya está en ejecución.';
    msg.style.color = '#ff9800';
  } else {
    msg.textContent = 'Iniciado. Revisa los logs.';
    msg.style.color = '#4caf50';
  }
  btn.disabled = false;
}

// ── Leads ─────────────────────────────────────────────────────
async function loadLeads() {
  const leads = await fetch('/api/leads').then(r => r.json());
  const tbody = document.getElementById('leads-body');
  if (!leads.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Sin leads aún</td></tr>';
    return;
  }
  tbody.innerHTML = leads.map(l => `
    <tr>
      <td>@${l.username}</td>
      <td title="${l.bio || ''}">${(l.bio || '—').slice(0,40)}</td>
      <td><span class="badge ${l.status}">${l.status}</span></td>
      <td>${fmt(l.timestamp)}</td>
    </tr>`).join('');
}

// ── Logs (SSE) ────────────────────────────────────────────────
const logBox = document.getElementById('log-box');
let autoScroll = true;
logBox.addEventListener('scroll', () => {
  autoScroll = logBox.scrollTop + logBox.clientHeight >= logBox.scrollHeight - 20;
});

function appendLog(entry) {
  const line = document.createElement('div');
  const ts = entry.ts.slice(11,19);
  line.innerHTML = `<span class="log-ts">${ts}</span>  <span class="${logClass(entry.msg)}">${entry.msg}</span>`;
  logBox.appendChild(line);
  if (autoScroll) logBox.scrollTop = logBox.scrollHeight;
}

function clearLogs() { logBox.innerHTML = ''; }

const evtSource = new EventSource('/api/logs');
evtSource.onmessage = (e) => appendLog(JSON.parse(e.data));

// ── Status polling ────────────────────────────────────────────
const dot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const runBtn = document.getElementById('btn-run');

async function pollStatus() {
  const { running } = await fetch('/api/status').then(r => r.json());
  if (running) {
    dot.className = 'running';
    statusText.textContent = 'Ejecutando...';
    runBtn.classList.add('running-state');
    runBtn.textContent = '⏳ En ejecución';
  } else {
    dot.className = 'idle';
    statusText.textContent = 'Idle';
    runBtn.classList.remove('running-state');
    runBtn.textContent = '▶ Ejecutar ahora';
  }
}

// ── Init ──────────────────────────────────────────────────────
loadConfig();
loadStats();
loadLeads();
pollStatus();
setInterval(pollStatus, 4000);
setInterval(() => { loadStats(); loadLeads(); }, 15000);
</script>
</body>
</html>
